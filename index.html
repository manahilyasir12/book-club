<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎂</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="birthday-card">

        <div class="balloons">
            🎈 🎈 🎈
        </div>

        <h1>Happy Birthday! 🎂</h1>

        <h2>To Someone Very Special 💗</h2>

        <p class="message">
            Wishing you a day filled with happiness, laughter,
            love and lots of beautiful memories! ✨
        </p>

        <p class="message">
            May this new year of your life bring you
            amazing adventures and everything you've wished for. 🌸
        </p>

        <button onclick="showSurprise()">
            🎁 Open Your Surprise
        </button>

        <p id="surprise"></p>

        <div class="cake">
            🎂
        </div>

        <p class="footer">
            Made with 💕 just for you
        </p>

    </div>

    <script>
        function showSurprise() {
            document.getElementById("surprise").innerHTML =
                "🌟 You deserve all the happiness in the world! 🌟";
        }
    </script>

</body>
</html>
